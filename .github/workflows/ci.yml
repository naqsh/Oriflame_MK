# Verification gates for every PR and every push to the integration branch.
# Placeholder configuration only: no secrets, no real consultant code or referral URL,
# and no test may reach Oriflame. Actions are pinned to release commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [epic/autonomus-implementation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CORS_ORIGINS: http://localhost:3000
  ORIFLAME_COUNTRY: PK
  ORIFLAME_CONSULTANT_CODE: ""
  ORIFLAME_REFERRAL_URL: ""
  ORIFLAME_REFERRAL_METHOD: official_url

jobs:
  backend:
    name: Backend (ruff, mypy, alembic, pytest, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database credentials, not secrets.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/oriflame_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check backend
      - name: Ruff format
        run: uv run ruff format --check backend
      - name: mypy
        run: uv run mypy backend
      - name: Alembic upgrade head on a fresh database
        run: uv run alembic upgrade head
      - name: Create the separate test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE oriflame_test"
      - name: pytest with coverage (fail under 80%)
        run: uv run pytest --cov-report=xml
      - name: Dependency audit
        run: uv run pip-audit --skip-editable

  frontend:
    name: Frontend (lint, typecheck, vitest, build, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (fails if package-lock.json is out of date)
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest with coverage
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          SITE_URL: http://localhost:3000
      - name: Dependency audit (runtime, high and critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Smoke tests (Playwright starts backend and frontend)
        run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
